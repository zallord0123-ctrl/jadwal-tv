<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal TV - Bintang Pelajar</title>
    <!-- Font Montserrat (Bawaan Bintang Pelajar) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { 
            background-color: #e0f2fe; /* Warna latar biru muda soft */
            color: #1e293b; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Menghilangkan scrollbar di TV */
        }
        
        /* ========================================= */
        /* HEADER (KOP ATAS) */
        /* ========================================= */
        .header { 
            background: white; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border-radius: 0 0 25px 25px; 
            margin: 0 15px 15px 15px; 
        }
        .header-left h3 { color: #f59e0b; font-size: 13px; font-weight: 800; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase;}
        .header-left h1 { color: #1e3a8a; font-size: 26px; font-weight: 900; }
        
        /* Pastikan Link Logo Asli Bintang Pelajar */
        .header-center img { height: 50px; }
        
        .header-right { text-align: right; }
        .time { font-size: 38px; font-weight: 900; color: #1e3a8a; line-height: 1; letter-spacing: -1px;}
        .date { font-size: 13px; color: #64748b; font-weight: 700; margin-top: 5px; }
        .quran { font-size: 11px; color: #059669; font-weight: 800; background: #d1fae5; padding: 4px 10px; border-radius: 12px; display: inline-block; margin-top: 6px; }

        /* ========================================= */
        /* MAIN CONTENT (GRID KOTAK-KOTAK RUANGAN) */
        /* ========================================= */
        .main-content { 
            flex: 1; 
            padding: 0 15px; 
            overflow: hidden; 
        }
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 15px; 
            height: 100%;
            align-content: start;
        }
        
        /* ========================================= */
        /* DESAIN KARTU RUANGAN */
        /* ========================================= */
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 18px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.04); 
            display: flex; 
            flex-direction: column; 
            border-top: 5px solid #1e3a8a; 
            border-left: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }
        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
        }
        .room-badge { 
            background: #fef3c7; 
            color: #d97706; 
            font-size: 13px; 
            font-weight: 800; 
            padding: 5px 12px; 
            border-radius: 8px; 
        }
        .time-badge { 
            font-size: 15px; 
            font-weight: 900; 
            color: #d97706; 
        }
        
        /* 💡 REVISI 1: GURU DAN MAPEL SEJAJAR KANAN KIRI */
        .guru-mapel-container { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            gap: 10px; 
            margin-bottom: 12px; 
            flex-wrap: wrap; 
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .guru-name { 
            font-size: 16px; 
            font-weight: 800; 
            color: #1e3a8a; 
        }
        .mapel-badge { 
            background: #0d9488; 
            color: white; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 800; 
        }
        
        /* 💡 REVISI 2: UKURAN FONT SISWA DIPERBESAR */
        .student-title { 
            font-size: 11px; 
            color: #94a3b8; 
            font-weight: 800; 
            margin-bottom: 8px; 
            letter-spacing: 0.5px;
        }
        .student-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* Membagi siswa ke 2 Kolom */
            gap: 6px 12px; 
            font-size: 14px; /* <--- UKURAN FONT SUDAH DIPERBESAR */
            font-weight: 700; 
            color: #334155; 
            line-height: 1.4; /* Jarak antar baris diperlebar sedikit agar nyaman dibaca */
        }
        
        /* ========================================= */
        /* FOOTER (TEKS BERJALAN) */
        /* ========================================= */
        .footer { 
            background: white; 
            margin: 15px; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            padding: 12px 25px; 
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05); 
        }
        .info-btn { 
            background: #1e3a8a; 
            color: white; 
            padding: 10px 25px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 15px; 
            white-space: nowrap; 
            margin-right: 20px; 
            letter-spacing: 1px;
        }
        .marquee-container { 
            flex: 1; 
            overflow: hidden; 
            white-space: nowrap; 
        }
        .marquee-text { 
            display: inline-block; 
            font-weight: 800; 
            color: #1e3a8a; 
            font-size: 16px; 
            animation: marquee 25s linear infinite; 
        }
        @keyframes marquee { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }
    </style>
</head>
<body>

    <!-- KOP HEADER -->
    <header class="header">
        <div class="header-left">
            <h3>Jadwal Belajar</h3>
            <h1>Bintang Pelajar Pesona Khayangan Depok</h1>
        </div>
        <div class="header-center">
            <!-- Bisa diganti dengan URL Logo BP milik Bapak/Ibu -->
            <img src="https://www.bintangpelajar.com/wp-content/uploads/2020/12/logo-Bintang-Pelajar.png" alt="Logo BP">
        </div>
        <div class="header-right">
            <div class="time" id="clock">00:00</div>
            <div class="date" id="date">Memuat Tanggal...</div>
            <div class="quran">🌿 Q.S. An-Naba'</div>
        </div>
    </header>

    <!-- AREA KARTU JADWAL -->
    <main class="main-content">
        <div class="grid-container" id="ruangan-container">
            <!-- Data Jadwal Akan Terisi Disini Oleh Javascript -->
        </div>
    </main>

    <!-- TEKS BERJALAN BAWAH -->
    <footer class="footer">
        <div class="info-btn">INFORMASI</div>
        <div class="marquee-container">
            <div class="marquee-text">
                ⭐ BINTANG PELAJAR: Prestasi Tinggi & Akhlak Terpuji! ✦ Dilengkapi pendampingan ibadah Islami ✦ Pilihan eksklusif 1 kelas 5 siswa ✦ Selamat belajar! ⭐
            </div>
        </div>
    </footer>


    <!-- SCRIPT (JAM OTOMATIS & PENGAMBIL DATA) -->
    <script>
        // 1. PENGATUR JAM DIGITAL
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;

            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('date').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. FUNGSI MERENDER HTML KE LAYAR TV
        function renderJadwal(dataHarian) {
            const container = document.getElementById('ruangan-container');
            container.innerHTML = '';

            dataHarian.forEach(item => {
                // Memecah list siswa (asumsi data siswa dipisah menggunakan <br> dari Apps Script)
                let arraySiswa = item.siswa.split('<br>');
                let siswaHtml = arraySiswa.map(nama => {
                    if(nama.trim() !== "" && nama.trim() !== "-") {
                        return `<div>${nama.trim()}</div>`;
                    }
                    return '';
                }).join('');

                const cardHtml = `
                    <div class="card">
                        <div class="card-header">
                            <div class="room-badge">${item.ruang}</div>
                            <div class="time-badge">${item.sesi}</div>
                        </div>
                        
                        <!-- Wujud Baru: Guru dan Mapel bersebelahan -->
                        <div class="guru-mapel-container">
                            <div class="guru-name">${item.guru}</div>
                            <div class="mapel-badge">${item.mapel}</div>
                        </div>

                        <div class="student-title">DAFTAR SISWA:</div>
                        
                        <!-- Wujud Baru: Font Siswa Lebih Besar -->
                        <div class="student-grid">
                            ${siswaHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // 3. FUNGSI MENGAMBIL DATA DARI GOOGLE APPS SCRIPT
        // ⚠️ PENTING: Ganti URL di bawah ini dengan URL Web App Apps Script Bapak/Ibu!
        // URL tersebut biasanya berakhiran /exec (tanpa ?v=publik)
        const URL_APPS_SCRIPT = "ISI_DENGAN_URL_APPS_SCRIPT_BAPAK_IBU_DISINI";

        async function tarikDataDariGoogle() {
            try {
                // Jika ingin menggunakan fetch langsung dari link Web App Bapak/Ibu:
                /*
                const response = await fetch(URL_APPS_SCRIPT);
                const json = await response.json();
                if (json.status === 'success') {
                    renderJadwal(json.data);
                }
                */

                // ========================================================
                // SEBAGAI CONTOH SEMENTARA SAYA BERIKAN DATA DUMMY
                // Hapus data dummy ini dan aktifkan fungsi fetch di atas
                // jika Bapak/Ibu sudah menyambungkannya dengan Apps Script
                // ========================================================
                const dummyData = [
                    { ruang: "Ruang 1", sesi: "09.00", guru: "Nur Nilam Sari", mapel: "SCI/7P", siswa: "Shaqila Kanaya<br>Ramanda" },
                    { ruang: "Ruang 2", sesi: "09.00", guru: "Rosmalida Widianti", mapel: "MTK/6D", siswa: "Aminah Cendekia<br>Sholihah<br>Narendra Praditya<br>Wardhana" },
                    { ruang: "Ruang 3", sesi: "09.00", guru: "Widya Sari", mapel: "IPA/9P", siswa: "Humaira Amalya<br>Nurfayza<br>Alegra Milane<br>Lengkong<br>Chifazta Shaumi" },
                    { ruang: "Ruang 4", sesi: "09.00", guru: "Faradila Zuchrina", mapel: "IND/9P", siswa: "Rafli Arrasy Achmad<br>Mikhail Aliyan Rasyif<br>Muhammad Rafa<br>Khairy" },
                    { ruang: "Ruang 6", sesi: "09.00", guru: "Eka Anjarwati", mapel: "MTK/10A", siswa: "Fahmi Arsyad Majid<br>Azzam Pradipta<br>Dewanto<br>Muhammad Irsyad<br>Zidane" },
                    { ruang: "Ruang 7", sesi: "09.00", guru: "Rahayu Anggraeni P", mapel: "MTK/8P", siswa: "Faliha Alma Rubina<br>Alika Faeezah<br>Alisha Qonita<br>Alesha Hasna Ratifa" }
                ];
                renderJadwal(dummyData);

            } catch (error) {
                console.error("Gagal menarik data ruangan:", error);
            }
        }

        // Panggil penarik data pertama kali
        tarikDataDariGoogle();
        
        // Auto-refresh data setiap 1 Menit (60.000 ms)
        setInterval(tarikDataDariGoogle, 60000);

    </script>
</body>
</html>
